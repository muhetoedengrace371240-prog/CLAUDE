name: muheto
description: "MUHETO - La voix de l'Afrique. Application mobile/web multiplateforme."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Firebase ---
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2

  # --- UI / Media ---
  video_player: ^2.9.2
  visibility_detector: ^0.4.0+2
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # --- Capture & Publication (Brique 3) ---
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  video_thumbnail: ^0.5.3
  path_provider: ^2.1.4

  # --- Business Local (Brique 7) ---
  url_launcher: ^6.3.1

  # --- State management ---
  provider: ^6.1.2

  # --- Utils ---
  intl: ^0.19.0
  timeago: ^3.7.0
  cupertino_icons: ^1.0.8
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Décommente une fois les assets ajoutés dans /assets
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/lang/
