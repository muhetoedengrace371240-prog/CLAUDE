name: muheto_app
description: "MUHETO - Application Flutter unifiée"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  video_player: ^2.9.2
  visibility_detector: ^0.4.0+2
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  get_video_thumbnail: ^0.9.0
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  intl: 0.20.2
  timeago: ^3.7.0
  cupertino_icons: ^1.0.8
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lang/
